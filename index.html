const years = ["2014", "2018", "2022", "2026"];
const defaultYear = "2026";
const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const tabs = document.getElementById("tabs");
const rows = document.getElementById("rows");
const contribHead = document.getElementById("contrib-head");
const search = document.getElementById("search");
let current = defaultYear;
let sortKey = "rank";
let sortDir = 1;
const numericKeys = ["rank", "amount"];

function compare(a, b) {
  const x = sortKey === "rank" ? Number(a.rank) : a[sortKey];
  const y = sortKey === "rank" ? Number(b.rank) : b[sortKey];
  const c = numericKeys.includes(sortKey) ? x - y : x.localeCompare(y);
  return c * sortDir || Number(a.rank) - Number(b.rank);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Escape s and wrap each case-insensitive occurrence of q (already lowercased) in <mark>
function hl(s, q) {
  s = String(s);
  if (!q) return esc(s);
  const lower = s.toLowerCase();
  let out = "", i = 0, j;
  while ((j = lower.indexOf(q, i)) !== -1) {
    out += esc(s.slice(i, j)) + "<mark>" + esc(s.slice(j, j + q.length)) + "</mark>";
    i = j + q.length;
  }
  return out + esc(s.slice(i));
}

function show(year) {
  current = year;
  const d = DATA[year];
  const q = search.value.trim().toLowerCase();
  const matches = q
    ? d.rows.filter(r => [r.donor, r.party, r.sector, r.dark].some(v => v.toLowerCase().includes(q)))
    : d.rows.slice();
  matches.sort(compare);
  document.querySelectorAll("th[data-key]").forEach(th => {
    const on = th.dataset.key === sortKey;
    th.querySelector(".arrow").textContent = on ? (sortDir === 1 ? "▲" : "▼") : "";
    th.setAttribute("aria-sort", on ? (sortDir === 1 ? "ascending" : "descending") : "none");
  });
  contribHead.innerHTML = esc(d.contribLabel).replace(" through ", "<br>through ");
  rows.innerHTML = matches.length === 0
    ? `<tr><td class="empty" colspan="6">No donors match “${esc(search.value.trim())}” in ${year}.</td></tr>`
    : matches.map(r => `<tr>
    <td class="num">${esc(r.rank)}</td>
    <td class="donor">${hl(r.donor, q)}</td>
    <td class="num">${fmt.format(r.amount)}</td>
    <td>${hl(r.party, q)}</td>
    <td>${hl(r.sector, q)}</td>
    <td>${hl(r.dark, q)}</td>
  </tr>`).join("");
  tabs.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.year === year);
    b.setAttribute("aria-selected", b.dataset.year === year);
  });
}

years.forEach(y => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "toggle-btn";
  b.setAttribute("role", "tab");
  b.dataset.year = y;
  b.textContent = y;
  b.addEventListener("click", () => show(y));
  tabs.appendChild(b);
});
document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (key === sortKey) {
      sortDir = -sortDir;
    } else {
      sortKey = key;
      sortDir = key === "amount" ? -1 : 1;
    }
    show(current);
  });
});
search.addEventListener("input", () => show(current));
show(defaultYear);

// Tell an embedding page how tall the content is so the iframe can fit it without scrolling
const container = document.getElementById("container");
function postHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(container.getBoundingClientRect().height) + 20;
  window.parent.postMessage({ mipTop40Height: h }, "*");
}
new ResizeObserver(postHeight).observe(container);
window.addEventListener("load", postHeight);
</script>
